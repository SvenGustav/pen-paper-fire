<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdfdfb">
<meta name="mobile-web-app-capable" content="yes">
<title>Pen, Paper, Fire: controller</title>
<style>
  html, body { margin: 0; height: 100%; background: #fdfdfb; color: #1818e0; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="pad" aria-describedby="how"></canvas>
<p id="how" class="sr">Phone controller. Drag the stick on the right toward where you want your line to go. Hold the jump area on the left to hop over lines. On the title and between rounds, the jump area starts the next round, and pushing the stick left or right switches between Duel and Duet.</p>
<script src="sketch.js"></script>
<script>
(() => {
'use strict';
const cv = document.getElementById('pad'), c = cv.getContext('2d');
let vw = 0, vh = 0, sheet = null, bar = 0, dpr = 1;
const zones = { c: null, s: null, swap: null };
let seat = -1, taken = [false, false], full = false, online = false, ws = null;
let st = { s: 'title', mode: 0, match: false, p: [] };
const pointers = new Map();          // id -> { x, y, ox, oy, zone }
let jump = 0, aim = null, sentAim = null, sentJump = 0, stick = null;
let shown = '', sizeT = 0, lastSize = '';
const DEAD = 11;                     // px the thumb must move before the stick means anything

function resize() {
  const size = window.innerWidth + 'x' + window.innerHeight; if (size === lastSize) return; lastSize = size;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  const m = 9, pad = 14, gap = 12; bar = 52;
  const sw0 = Math.min(vw - m * 2 - 4, 640), sh0 = Math.min(vh - m * 2 - 5, 290);      // a compact pad, not the whole screen
  sheet = { x: (vw - sw0) / 2, y: vw > vh ? (vh - sh0) / 2 : vh - sh0 - 26, w: sw0, h: sh0 };
  const x0 = sheet.x + pad, y0 = sheet.y + bar, w = sheet.w - pad * 2, h = sheet.h - bar - pad, cw = w * 0.32;
  zones.c = { x: x0, y: y0, w: cw, h };                                                 // jump under the left thumb
  zones.s = { x: x0 + cw + gap, y: y0, w: w - cw - gap, h };                            // stick under the right
  zones.swap = { x: sheet.x + sheet.w - pad - 118, y: sheet.y + 9, w: 118, h: 34 };
  draw();
}
const inZone = (z, x, y, grow = 6) => z && x >= z.x - grow && x <= z.x + z.w + grow && y >= z.y - grow && y <= z.y + z.h + grow;
const canSwap = () => false;
const col = () => (INSTRUMENTS[seat] || INSTRUMENTS[0])[1];
const mine = () => st.p.find(q => q.i === seat) || null;
const stickR = () => Math.min(zones.s.w, zones.s.h) * 0.3;

function zone(z, pressed, color) {
  const r = Math.min(26, z.w * 0.12, z.h * 0.12), o = pressed ? 2.5 : 0;
  if (pressed) {
    c.save(); c.beginPath(); c.roundRect(z.x + o, z.y + o, z.w, z.h, r); c.clip();
    for (let d = -z.h; d < z.w; d += 10) sline(c, z.x + d, z.y + z.h, z.x + d + z.h, z.y, 1.7, color, 0.9);
    c.restore();
  } else sline(c, z.x + r, z.y + z.h + 5, z.x + z.w - r, z.y + z.h + 5, 2, color, 0.6);
  sRoundRect(c, z.x + o, z.y + o, z.w, z.h, r, 3.2, color, 0.8);
}
function blank(z) { c.fillStyle = PAPER_COL; c.beginPath(); c.roundRect(z.x, z.y, z.w, z.h, Math.min(26, z.h * 0.12)); c.fill(); }
function plate(cx, cy, w, h) { c.fillStyle = PAPER_COL; c.beginPath(); c.roundRect(cx - w / 2, cy - h / 2, w, h, 8); c.fill(); }
function draw() {
  if (!sheet) return;
  // phones throw the canvas state away when the tab is backgrounded or the GPU resets: set the scale on every draw
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.lineCap = 'round'; c.lineJoin = 'round'; c.globalAlpha = 1; c.setLineDash([]);
  const color = col(), me = mine() || { m: 1, a: 1, n: 0 }, waiting = !mine() && st.s !== 'title';
  // the controller is a page from the same notebook: ruled, with the red margin
  c.fillStyle = PAPER_COL; c.fillRect(0, 0, vw, vh);
  c.strokeStyle = 'rgba(70,120,215,0.3)'; c.lineWidth = 1; c.beginPath();
  for (let y = 44; y < vh; y += 24) { c.moveTo(0, y + 0.5); c.lineTo(vw, y + 0.5); }
  c.stroke();
  const mxl = Math.max(14, sheet.x - 12);
  c.strokeStyle = 'rgba(226,72,88,0.5)'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(mxl + 0.5, 0); c.lineTo(mxl + 0.5, vh); c.stroke();
  const tx = sheet.x + 16, ty = sheet.y + 17, mx0 = sheet.x + sheet.w / 2, my0 = sheet.y + sheet.h / 2;
  if (full) { drawText(c, 'BOTH SEATS ARE TAKEN', mx0, my0 - 22, 15, { align: 'center', lw: 2 }); drawText(c, 'THIS PAGE JOINS WHEN ONE FREES UP', mx0, my0 + 12, 8.5, { align: 'center', lw: 1.2 }); return; }
  if (seat < 0) { drawText(c, online ? 'FINDING A SEAT' : 'LOOKING FOR THE GAME', mx0, my0 - 10, 15, { align: 'center', lw: 2 }); return; }
  const name = (INSTRUMENTS[seat] || INSTRUMENTS[0])[0];
  drawText(c, name, tx, ty, 19, { color, lw: 2.5 });
  const note = !online ? 'RECONNECTING' : waiting ? 'YOU ARE IN FROM THE NEXT ROUND' : (st.s === 'play' || st.s === 'over') && !me.a ? 'OUT' : '';
  if (note) drawText(c, note, tx + textWidth(name, 19) + 16, ty + 5, 9.5, { color, lw: 1.4 });
  if (canSwap()) { const z = zones.swap; sRoundRect(c, z.x, z.y, z.w, z.h, 9, 1.8, INK, 0.5); drawText(c, 'BE ' + (seat ? 'PEN' : 'PENCIL'), z.x + z.w / 2, z.y + 12, 9.5, { align: 'center', lw: 1.4 }); }
  // the stick: touch anywhere in the box and drag toward where the line should go
  {
    const z = zones.s, R = stickR(), live = !!stick;
    blank(z);
    sRoundRect(c, z.x, z.y, z.w, z.h, Math.min(26, z.h * 0.12), 3.2, color, 0.8);
    sline(c, z.x + 26, z.y + z.h + 5, z.x + z.w - 26, z.y + z.h + 5, 2, color, 0.6);
    const bx = live ? Math.max(z.x + R + 8, Math.min(z.x + z.w - R - 8, stick.ox)) : z.x + z.w / 2, by = live ? Math.max(z.y + R + 8, Math.min(z.y + z.h - R - 8, stick.oy)) : z.y + z.h / 2;
    c.strokeStyle = color; c.lineWidth = 2; c.setLineDash([7, 6]); c.beginPath(); c.arc(bx, by, R, 0, 7); c.stroke(); c.setLineDash([]);
    let kx = bx, ky = by;
    if (live) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy) || 1, k = Math.min(d, R) / d; kx = bx + dx * k; ky = by + dy * k; }
    if (aim != null) {
      sline(c, bx, by, kx, ky, 3, color, 0.4);
      const ax = bx + Math.cos(aim) * (R + 16), ay = by + Math.sin(aim) * (R + 16), n = aim + Math.PI;      // arrowhead outside the ring
      sline(c, ax, ay, ax + Math.cos(n + 0.6) * 12, ay + Math.sin(n + 0.6) * 12, 3, color, 0.3); sline(c, ax, ay, ax + Math.cos(n - 0.6) * 12, ay + Math.sin(n - 0.6) * 12, 3, color, 0.3);
    }
    const kr = R * 0.46;
    c.fillStyle = PAPER_COL; c.beginPath(); c.arc(kx, ky, kr, 0, 7); c.fill();
    if (live) { c.fillStyle = color; c.beginPath(); c.arc(kx, ky, kr - 4, 0, 7); c.fill(); }
    c.strokeStyle = color; c.lineWidth = 3; c.beginPath(); c.arc(kx, ky, kr, 0, 7); c.stroke();
    if (!live) drawText(c, 'DRAG WHERE YOU WANT TO GO', z.x + z.w / 2, z.y + z.h - 20, Math.min(8.5, (z.w - 20) / 25), { align: 'center', color, lw: 1.2 });
  }
  // jump, or the one thing to press between rounds
  const z = zones.c, o = jump ? 2.5 : 0, cx = z.x + z.w / 2 + o, cy = z.y + z.h / 2 + o, live = st.s === 'play' || st.s === 'ready';
  blank(z); zone(z, jump, color);
  if (live) {
    const s = Math.min(z.w * 0.5, z.h * 0.42);
    if (jump) plate(cx, cy - 4, Math.min(z.w - 16, s * 1.9), s + 60);
    hopIcon(c, cx, cy - 6, s, color, Math.max(2.6, s * 0.06));
    const n = 6, dw = Math.min(13, (z.w - 30) / n - 5), total = n * dw + (n - 1) * 5, mx = cx - total / 2, my = cy + s * 0.3 + 12;
    for (let i = 0; i < n; i++) {
      const f = Math.max(0, Math.min(1, me.m * n - i)), dx = mx + i * (dw + 5);
      if (f > 0.05) sline(c, dx, my, dx + dw * f, my, 3, color, 0.3); else { c.fillStyle = '#b9b9d6'; c.beginPath(); c.arc(dx + 1, my, 1.3, 0, 7); c.fill(); }
    }
    drawText(c, 'JUMP', cx, my + 13, 9.5, { align: 'center', color, lw: 1.4 });
  } else {
    const big = st.s === 'paused' ? 'CARRY ON' : st.s === 'title' ? 'START' : st.match ? 'REMATCH' : st.mode ? 'AGAIN' : 'NEXT';
    const cap = Math.min(28, (z.w - 30) / (big.length * 0.95));
    if (jump) plate(cx, cy, Math.min(z.w - 14, textWidth(big, cap) + 30), cap + 70);
    drawText(c, big, cx, cy - cap / 2 - 8, cap, { align: 'center', lw: Math.max(2.2, cap * 0.11) });
    const sub = st.s === 'title' ? (st.mode ? 'DUET' : 'DUEL') : st.s === 'over' && !st.mode && mine() ? 'YOU HAVE ' + me.n : 'TAP HERE';
    drawText(c, sub, cx, cy + cap / 2 + 12, Math.min(9.5, (z.w - 24) / (sub.length * 0.95)), { align: 'center', lw: 1.3 });
  }
}

// ---------------------------------------------------------------- connection
function sendIn() {
  if (!ws || ws.readyState !== 1) return;
  sentAim = aim; sentJump = jump;
  ws.send(JSON.stringify({ t: 'in', c: jump, a: aim == null ? null : Math.round(aim * 100) / 100 }));
}
function connect() {
  let saved = ''; try { saved = sessionStorage.getItem('pps-seat') || ''; } catch (e) { /* private mode */ }
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=pad&seat=' + saved);
  ws.onopen = () => { online = true; draw(); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.t === 'you') { seat = m.seat; taken = m.s; full = false; try { sessionStorage.setItem('pps-seat', String(seat)); } catch (err) { /* private mode */ } sendIn(); }
    else if (m.t === 'full') { full = true; seat = -1; }
    else if (m.t === 'st') {
      const before = mine(), was = before && before.a, wasState = st.s; st = m;
      const now = mine();
      if (was && now && !now.a && navigator.vibrate) navigator.vibrate(220);
      if (wasState !== m.s && m.s === 'play' && navigator.vibrate) navigator.vibrate(30);
      const key = [m.s, m.mode, m.match, now ? now.a + '.' + Math.ceil(now.m * 6) + '.' + now.n : 'x'].join();
      if (key === shown) return;
      shown = key;
    } else if (m.t !== 'seats') return;
    draw();
  };
  ws.onclose = () => { online = false; if (full) seat = -1; draw(); setTimeout(connect, full ? 2500 : 900); };
}
setInterval(sendIn, 1000);      // doubles as the "still here" signal

// ---------------------------------------------------------------- touch
function recompute() {
  let j = 0; stick = null;
  for (const p of pointers.values()) { if (p.zone === 'c') j = 1; else if (p.zone === 's' && !stick) stick = p; }
  let a = null;
  if (stick) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy; if (Math.hypot(dx, dy) > DEAD) a = Math.atan2(dy, dx); }
  if (j && !jump && navigator.vibrate) navigator.vibrate(8);
  jump = j; aim = a;
  const turned = (aim == null) !== (sentAim == null) || (aim != null && Math.abs(Math.atan2(Math.sin(aim - sentAim), Math.cos(aim - sentAim))) > 0.04);
  if (turned || jump !== sentJump) sendIn();
  draw();
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  if (canSwap() && inZone(zones.swap, x, y, 8)) { ws.send(JSON.stringify({ t: 'swap' })); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
  const zn = inZone(zones.c, x, y) ? 'c' : inZone(zones.s, x, y, 14) ? 's' : '';
  pointers.set(e.pointerId, { x, y, ox: x, oy: y, zone: zn });
  if (zn === 'c' && st.s !== 'play' && st.s !== 'ready' && ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'go' }));
  recompute();
});
cv.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (p.zone === 's') {            // the base follows a thumb that drags past the rim, so reversing direction is always a short move
    const R = stickR(), dx = p.x - p.ox, dy = p.y - p.oy, d = Math.hypot(dx, dy);
    if (d > R) { p.ox = p.x - dx / d * R; p.oy = p.y - dy / d * R; }
    recompute();
  }
});
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) cv.addEventListener(ev, (e) => { if (pointers.delete(e.pointerId)) recompute(); });
cv.addEventListener('contextrestored', draw);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastSize = ''; resize(); } });
addEventListener('pageshow', () => { lastSize = ''; resize(); });
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('blur', () => { pointers.clear(); recompute(); });
addEventListener('resize', () => { clearTimeout(sizeT); sizeT = setTimeout(resize, 120); });      // browser bars sliding in and out fire this constantly
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });   // no scroll, zoom or text loupe
resize(); connect();
})();
</script>
</body>
</html>
